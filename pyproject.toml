[project]
name = "kurumsal-ai-asistan"
version = "0.1.0"
description = "RAG + Agent tabanlı kurumsal AI asistanı"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
