<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurumsal AI Asistanı</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --accent: #2f5bea; --accent-soft: #e8eefe;
    --user: #2f5bea; --user-text: #ffffff; --error: #c62828; --error-soft: #fdecec;
    --highlight: #fff4cc;
    --ok: #2e7d32; --warn: #8a5a00; --warn-soft: #fff6e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #9aa1ad;
      --border: #2b313c; --accent: #7c9cff; --accent-soft: #232c45;
      --user: #3b5bdb; --user-text: #ffffff; --error: #ff8a80; --error-soft: #3a1f1f;
      --highlight: #3d3720;
      --ok: #81c784; --warn: #ffcc80; --warn-soft: #3a2f1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  main { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .empty { text-align: center; color: var(--muted); margin-top: 8vh; }
  .empty p { margin: 0 0 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 7px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .msg { padding: 12px 15px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.error { align-self: flex-start; background: var(--error-soft); color: var(--error); border: 1px solid var(--error); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; white-space: normal; }
  .cite {
    display: inline-block; background: var(--accent-soft); color: var(--accent); border: none;
    border-radius: 5px; padding: 0 5px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  details.sources { margin-top: 10px; white-space: normal; }
  details.sources summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .source {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 8px;
    font-size: 13px; transition: background .3s;
  }
  .source.hl { background: var(--highlight); }
  .source b { color: var(--accent); }
  .source .snippet { color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
  /* Bulunan ama cevapta atıf yapılmayan kaynaklar: soluk göster (şeffaflık için listede kalıyor) */
  .source.uncited { opacity: .55; }
  .source .tag { color: var(--muted); font-size: 12px; }
  /* "Bilgi yok" / konu dışı cevaplar: normal cevaptan ayırt edilsin diye kesikli çerçeve */
  .msg.bot.fallback { border-style: dashed; color: var(--muted); }
  /* Groundedness (hakem) sonucu: doğrulandı → küçük yeşil not; uydurma şüphesi → sarı uyarı kutusu */
  .verified { color: var(--ok); }
  .warning {
    margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; white-space: normal;
    background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn);
  }
  .warning ul { margin: 4px 0 0; padding-left: 18px; }
  .typing { color: var(--muted); font-style: italic; }
  form {
    border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px;
  }
  .composer { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-height: 44px; max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send {
    background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 18px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Kurumsal AI Asistanı</h1>
  <span>Dokümanlardan kaynak göstererek cevaplar</span>
</header>

<main id="scroll">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <p>Şirket dokümanları hakkında bir soru sorun.</p>
      <div class="chips">
        <button class="chip">Kıdemim 7 yıl, kaç gün yıllık iznim var?</button>
        <button class="chip">Yurt dışında yemek harcırahı ne kadar?</button>
        <button class="chip">Evden kaç gün çalışabilirim?</button>
        <button class="chip">Şifrem en az kaç karakter olmalı?</button>
      </div>
    </div>
  </div>
</main>

<form id="form">
  <div class="composer">
    <textarea id="input" rows="1" maxlength="1000" placeholder="Sorunuzu yazın… (Enter: gönder, Shift+Enter: yeni satır)" autofocus></textarea>
    <button class="send" id="send" type="submit">Sor</button>
  </div>
</form>

<script>
  const thread = document.getElementById("thread");
  const scroll = document.getElementById("scroll");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let counter = 0;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function addMessage(node) {
    document.getElementById("empty")?.remove();
    thread.appendChild(node);
    scroll.scrollTop = scroll.scrollHeight;
    return node;
  }

  // Cevap metnini güvenli şekilde (textContent) yazar, [n] atıflarını tıklanabilir yapar
  function renderAnswer(container, text, answerId) {
    const parts = text.split(/(\[\d+\])/g);
    for (const part of parts) {
      const m = part.match(/^\[(\d+)\]$/);
      if (m) {
        const btn = el("button", "cite", m[1]);
        btn.type = "button";
        btn.title = "Kaynağı göster";
        btn.onclick = () => highlightSource(answerId, m[1]);
        container.appendChild(btn);
      } else {
        container.appendChild(document.createTextNode(part));
      }
    }
  }

  function highlightSource(answerId, ref) {
    const details = document.getElementById(`sources-${answerId}`);
    const card = document.getElementById(`src-${answerId}-${ref}`);
    if (!details || !card) return;
    details.open = true;
    card.classList.add("hl");
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    setTimeout(() => card.classList.remove("hl"), 1800);
  }

  function renderSources(container, sources, answerId) {
    const details = el("details", "sources");
    details.id = `sources-${answerId}`;
    // Atıf yapılan kaynaklar başta; sort kararlı olduğu için kendi içlerinde retrieval sırası korunur
    const ordered = [...sources].sort((a, b) => Number(b.cited) - Number(a.cited));
    const citedCount = sources.filter((s) => s.cited).length;
    details.appendChild(el("summary", null, `Kaynaklar (${citedCount} kullanıldı, ${sources.length} bulundu)`));
    for (const s of ordered) {
      const card = el("div", s.cited ? "source" : "source uncited");
      card.id = `src-${answerId}-${s.ref}`;
      const head = el("div");
      head.appendChild(el("b", null, `[${s.ref}] `));
      head.appendChild(document.createTextNode(
        `${s.source} · sayfa ${s.page} · benzerlik ${(1 - s.score).toFixed(2)}`
      ));
      if (!s.cited) head.appendChild(el("span", "tag", " · cevapta kullanılmadı"));
      card.appendChild(head);
      card.appendChild(el("div", "snippet", s.snippet + "…"));
      details.appendChild(card);
    }
    container.appendChild(details);
  }

  async function ask(question) {
    addMessage(el("div", "msg user", question));
    const pending = addMessage(el("div", "msg bot typing", "Düşünüyor…"));
    const started = performance.now();
    const timer = setInterval(() => {
      pending.textContent = `Düşünüyor… ${((performance.now() - started) / 1000).toFixed(0)} sn`;
    }, 1000);
    send.disabled = true;

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = typeof body.detail === "string" ? body.detail : "Geçersiz istek";
        throw new Error(`${detail} (HTTP ${res.status})`);
      }
      const seconds = ((performance.now() - started) / 1000).toFixed(1);
      const answerId = ++counter;
      // answer_type'a göre görünüm (API: answered | not_found | off_topic | uncited)
      const isFallback = body.answer_type === "not_found" || body.answer_type === "off_topic";
      const msg = el("div", isFallback ? "msg bot fallback" : "msg bot");
      renderAnswer(msg, body.answer, answerId);
      const meta = el("div", "meta", `${seconds} sn`);
      msg.appendChild(meta);
      // Groundedness sonucu (null: kontrol kapalı ya da cevap kaynaklı değil → hiçbir şey gösterme)
      const g = body.groundedness;
      if (g && g.grounded) {
        meta.appendChild(el("span", "verified", " · ✓ kaynaklarla doğrulandı"));
      } else if (g && !g.grounded) {
        // Uydurma şüphesi: kullanıcıyı uyar ve hakemin desteksiz bulduğu ifadeleri listele
        const warn = el("div", "warning", "⚠ Bu cevapta dokümanlarda bulunamayan ifadeler olabilir:");
        const list = el("ul");
        for (const claim of g.unsupported_claims) list.appendChild(el("li", null, claim));
        warn.appendChild(list);
        msg.appendChild(warn);
      }
      // Kaynaklar sadece cevap gerçekten dokümanlara dayanıyorsa gösterilir. "Bilgi yok",
      // konu dışı veya selamlaşma cevaplarının altında alakasız kaynak kartları yanıltıcı olur.
      if (body.answer_type === "answered") {
        renderSources(msg, body.sources, answerId);
      }
      pending.replaceWith(msg);
      scroll.scrollTop = scroll.scrollHeight;
    } catch (err) {
      pending.replaceWith(el("div", "msg error", `Hata: ${err.message}`));
    } finally {
      clearInterval(timer);
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question || send.disabled) return;
    input.value = "";
    input.style.height = "";
    ask(question);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "";
    input.style.height = input.scrollHeight + "px";
  });

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => ask(chip.textContent));
  });
</script>
</body>
</html>
