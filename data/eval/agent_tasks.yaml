# Agent değerlendirme seti: doğru araçları seçiyor mu, doğru sonuca ulaşıyor mu?
#
#   expected_tools: Görevi doğru çözmek için çağrılması GEREKEN araçlar (sıra önemsiz)
#   must_contain:   Son cevapta geçmesi gerekenler ("a|b" = a veya b). Kur değiştiği için
#                   TL tutarları yerine doküman değerleri / kur kaynağı kontrol edilir.

tasks:
  # Yalnızca doküman araması
  - {id: a01, question: "Babalık izni kaç gün?", expected_tools: [search_documents], must_contain: ["10"]}
  - {id: a02, question: "Yıllık eğitim bütçem ne kadar?", expected_tools: [search_documents], must_contain: ["15.000|15000"]}
  - {id: a03, question: "Şifrem en az kaç karakter olmalı?", expected_tools: [search_documents], must_contain: ["12"]}
  # Yalnızca döviz kuru
  - {id: a04, question: "1 Euro bugün kaç TL?", expected_tools: [get_exchange_rate], must_contain: ["merkez bankası|kur"]}
  - {id: a05, question: "100 Amerikan doları kaç Euro eder?", expected_tools: [get_exchange_rate], must_contain: ["eur|euro"]}
  # İki araç gerektiren çok adımlı görevler
  - {id: a06, question: "Yurt dışı günlük yemek harcırahım kaç TL eder?", expected_tools: [search_documents, get_exchange_rate], must_contain: ["75"]}
  - {id: a07, question: "Yurt içi gecelik konaklama limiti kaç Euro'ya denk geliyor?", expected_tools: [search_documents, get_exchange_rate], must_contain: ["4.000|4000"]}
  - {id: a08, question: "Yıllık eğitim bütçem kaç dolar eder?", expected_tools: [search_documents, get_exchange_rate], must_contain: ["15.000|15000"]}
  # Araç gerektirmeyen
  - {id: a09, question: "Merhaba, nasılsın?", expected_tools: [], must_contain: []}
  - {id: a10, question: "Teşekkürler, çok yardımcı oldun.", expected_tools: [], must_contain: []}
  # Faz 3.5 — çok adımlı senaryolar: dokümandan bilgi bul + dış kaynaktan veri çek + karşılaştır/özetle
  - id: a11
    question: "Yurt dışı günlük yemek harcırahı ile yurt içi günlük yemek harcırahını TL cinsinden karşılaştır; hangisi daha yüksek ve fark ne kadar?"
    expected_tools: [search_documents, get_exchange_rate]
    must_contain: ["75", "1.200|1200", "yurt dışı"]
  - id: a12
    question: "Yurt dışında 3 günlük bir iş seyahatinde toplam yemek harcırahım kaç TL eder?"
    expected_tools: [search_documents, get_exchange_rate]
    must_contain: ["225|3 ×|3 x|3x|3 gün ×|× 3"]  # 75 × 3 = 225 € veya "3 gün × ..." hesabı
  # Faz 4.3 — SQL (çalışan verisi) + vektör arama (kurallar) birlikte
  - id: a13
    question: "Ayşe Yılmaz'ın yıllık izin hakkı kaç gün?"
    expected_tools: [query_employees, search_documents]
    must_contain: ["20"]
  - id: a14
    question: "Can Öztürk bu yıl kaç gün daha yıllık izin kullanabilir?"
    expected_tools: [query_employees, search_documents]
    must_contain: ["0 gün|hiç|kalmadı|kalmamış|tamamını"]
  - id: a15
    question: "İzmir ofisinde kaç çalışan var?"
    expected_tools: [query_employees]
    must_contain: ["2|iki"]
